name: Build & Deploy

# git push → build → Docker Hub. Watchtower on Docker Desktop picks the new
# :latest up within WATCHTOWER_POLL_INTERVAL and recreates the containers.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_PREFIX: m4rthin9 # Docker Hub namespace

permissions:
  contents: read

jobs:
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/prison-api:latest
            ${{ env.IMAGE_PREFIX }}/prison-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-web:
    name: Build Web Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [liff, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          target: serve
          build-args: APP=${{ matrix.app }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/prison-${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}/prison-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=web-${{ matrix.app }}
          cache-to: type=gha,scope=web-${{ matrix.app }},mode=max

  notify:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Status
        run: |
          if [ "${{ needs.build-api.result }}" == "success" ] && [ "${{ needs.build-web.result }}" == "success" ]; then
            echo "✅ Pushed to Docker Hub — watchtower will redeploy within its poll interval"
            echo "  - ${{ env.IMAGE_PREFIX }}/prison-api:latest"
            echo "  - ${{ env.IMAGE_PREFIX }}/prison-liff:latest"
            echo "  - ${{ env.IMAGE_PREFIX }}/prison-admin:latest"
          else
            echo "❌ Build failed"
            [ "${{ needs.build-api.result }}" != "success" ] && echo "  - API build failed"
            [ "${{ needs.build-web.result }}" != "success" ] && echo "  - Web builds failed"
            exit 1
          fi

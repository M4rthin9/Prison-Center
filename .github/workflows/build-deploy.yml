name: Build & Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: m4rthin9

permissions:
  contents: read
  packages: write

jobs:
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/prison-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/prison-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-web:
    name: Build Web Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [liff, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          target: serve
          build-args: APP=${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/prison-${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/prison-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=web-${{ matrix.app }}
          cache-to: type=gha,scope=web-${{ matrix.app }},mode=max

  notify:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Status
        run: |
          if [ "${{ needs.build-api.result }}" == "success" ] && [ "${{ needs.build-web.result }}" == "success" ]; then
            echo "✅ Docker build and push completed successfully!"
            echo ""
            echo "Images are now available:"
            echo "  - ${{ env.REGISTRY }}/${{ env.OWNER }}/prison-api:latest"
            echo "  - ${{ env.REGISTRY }}/${{ env.OWNER }}/prison-liff:latest"
            echo "  - ${{ env.REGISTRY }}/${{ env.OWNER }}/prison-admin:latest"
          else
            echo "❌ Build failed"
            if [ "${{ needs.build-api.result }}" != "success" ]; then
              echo "  - API build failed"
            fi
            if [ "${{ needs.build-web.result }}" != "success" ]; then
              echo "  - Web builds failed"
            fi
            exit 1
          fi

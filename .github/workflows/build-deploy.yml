name: Build & Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_HUB_REGISTRY: docker.io
  OWNER: m4rthin9

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
            context: .
          - name: liff
            dockerfile: docker/Dockerfile.web
            context: .
            build-args: APP=liff
          - name: admin
            dockerfile: docker/Dockerfile.web
            context: .
            build-args: APP=admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Push to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || 'serve' }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/prison-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/prison-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Optional: Push to Docker Hub (requires DOCKER_HUB credentials)
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_HUB_REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
        continue-on-error: true

      - name: Build and push to Docker Hub
        if: github.event_name == 'push' && secrets.DOCKER_HUB_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || 'serve' }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/prison-${{ matrix.name }}:latest
            ${{ env.DOCKER_HUB_USERNAME }}/prison-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
        continue-on-error: true

  notify:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Status
        run: |
          if [ "${{ needs.build-and-push.result }}" == "success" ]; then
            echo "✅ Docker build and push completed successfully!"
            echo "Images available at:"
            echo "  - ghcr.io/${{ env.OWNER }}/prison-api:latest"
            echo "  - ghcr.io/${{ env.OWNER }}/prison-liff:latest"
            echo "  - ghcr.io/${{ env.OWNER }}/prison-admin:latest"
          else
            echo "❌ Docker build failed"
            exit 1
          fi

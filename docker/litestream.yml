# Replicates the SQLite database continuously. Uploads are NOT covered here —
# they are files on the volume and need their own restic/rclone schedule.
# A restored database pointing at missing slip images is a compliance problem.
dbs:
  - path: /data/app.db
    replicas:
      - type: s3
        endpoint: ${LITESTREAM_ENDPOINT}
        bucket: ${LITESTREAM_BUCKET}
        path: prison-commerce/app.db
        region: ${LITESTREAM_REGION}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 720h
        sync-interval: 10s

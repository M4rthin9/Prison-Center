# Single VPS, in-country (decision #5). One API process, Caddy in front,
# Litestream replicating the SQLite file off-box.
#
# Images come from Docker Hub (built by .github/workflows/build-deploy.yml on
# push to main) — nothing is compiled on the box. Deploy:
#
#   docker login  # once; or set DOCKERHUB_USERNAME/TOKEN in docker/.env
#   git pull
#   docker compose -f docker/compose.yml pull
#   docker compose -f docker/compose.yml up -d
#
# NOT YET EXERCISED — validate on a scratch VPS and rehearse a restore
# before go-live.
name: prison-commerce

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - liff
      - admin

  api:
    image: m4rthin9/prison-api:latest
    restart: unless-stopped
    # Never set `deploy.replicas` or run this under cluster: one writer only.
    env_file: ../apps/api/.env.production
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/app.db
      STORAGE_LOCAL_DIR: /data/uploads
      COOKIE_SECURE: '1'
    volumes:
      - app_data:/data
    expose:
      - '8787'

  # Static builds shipped as self-contained Caddy images (Dockerfile.web
  # target `serve`): SPA fallback + same-origin /api,/files proxy baked in.
  liff:
    image: m4rthin9/prison-liff:latest
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8787
    expose:
      - '80'
    depends_on:
      - api

  admin:
    image: m4rthin9/prison-admin:latest
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8787
    expose:
      - '80'
    depends_on:
      - api

  # Continuous replication protects against disk loss. The nightly
  # `VACUUM INTO` snapshot (see docs/RUNBOOK.md) protects against a bad
  # migration, which is the more likely disaster — you need both.
  litestream:
    image: litestream/litestream:0.3
    restart: unless-stopped
    command: replicate -config /etc/litestream.yml
    volumes:
      - app_data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    env_file: ./litestream.env
    depends_on:
      - api

volumes:
  app_data:
  caddy_data:
  caddy_config:

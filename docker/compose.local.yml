# Local stack for Docker Desktop. Mirrors prod topology (static apps + one
# API writer on SQLite) but on localhost ports, no TLS, no Litestream.
#
#   docker compose -f docker/compose.local.yml up -d
#
#     LIFF    http://localhost:5173
#     Admin   http://localhost:5174
#     API     http://localhost:18787  (also reachable directly)
#
# Auto-update: CI pushes :latest to Docker Hub on every push to main;
# watchtower polls and recreates changed services. Credentials for private
# repos come from docker/.env (see .env.example).
#
# Seed dev fixtures (idempotent):
#   docker compose -f docker/compose.local.yml exec api pnpm db:seed
name: prison-commerce-local

services:
  api:
    # Published by GitHub Actions (build-deploy.yml) on push to main.
    image: cidabumbadklang/prison-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    environment:
      NODE_ENV: development
      PORT: '8787'
      JWT_SECRET: local-docker-only-secret-change-me-0123456789abcdef
      DATABASE_PATH: /data/app.db
      STORAGE_LOCAL_DIR: /data/uploads
      NOTIFIER_OUTBOX_PATH: /data/outbox.log
    volumes:
      - app_data:/data
    # Host 8787 is often your local `pnpm dev` API; the stack uses 18787.
    ports:
      - '18787:8787'

  liff:
    image: cidabumbadklang/prison-liff:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: serve
      args:
        APP: liff
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    environment:
      API_UPSTREAM: api:8787
    ports:
      - '5173:80'
    depends_on:
      - api

  admin:
    image: cidabumbadklang/prison-admin:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: serve
      args:
        APP: admin
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    environment:
      API_UPSTREAM: api:8787
    ports:
      - '5174:80'
    depends_on:
      - api

  # Polls Docker Hub for new :latest of the labelled services above and
  # recreates them in place. Volumes survive; only containers are replaced.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # containrrr/watchtower:latest still negotiates Docker API 1.25, which
      # Docker Engine 25+ refuses ("client version 1.25 is too old"). Pinning
      # the client version here is what keeps it from crash-looping.
      DOCKER_API_VERSION: '1.44'
      WATCHTOWER_POLL_INTERVAL: '300' # seconds between registry checks
      WATCHTOWER_LABEL_ENABLE: 'true' # only watch labelled containers
      WATCHTOWER_CLEANUP: 'true' # remove stale images after update
      REPO_USER: ${DOCKERHUB_USERNAME:-}
      REPO_PASS: ${DOCKERHUB_TOKEN:-}

volumes:
  app_data:
